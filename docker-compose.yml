services:
  lemario:
    build: .
    image: lemario
    container_name: lemario
    ports:
      - "${LEMARIO_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LEMARIO_DATABASE_PATH: /app/data/lemario.db
      # Solo loopback por defecto: tras un proxy (Coolify, Traefik) todo el tráfico
      # llega desde una IP privada de Docker, y confiar en esas redes abriría /docs
      # a cualquiera. Para verlo en local con Docker Desktop, ver .env.example.
      LEMARIO_TRUSTED_NETWORKS: ${LEMARIO_TRUSTED_NETWORKS:-127.0.0.0/8,::1/128}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # El healthcheck viene en la imagen (HEALTHCHECK del Dockerfile).
